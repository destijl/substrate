syntax = "proto3";

package egresscredential.v1;

option go_package = "github.com/agent-substrate/substrate/pkg/proto/egresscredentialpb/v1;egresscredentialv1";

// NodeProvider mints authentication headers for egress HTTP CONNECT requests.
service NodeProvider {
  // GetConfig queries the plugin for configuration required before minting headers.
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse) {}

  // MintConnectHeaders mints CONNECT headers for an actor's outbound connection.
  rpc MintConnectHeaders(MintConnectHeadersRequest) returns (MintConnectHeadersResponse) {}
}

message GetConfigRequest {}

message GetConfigResponse {
  // Target audiences for the actor JWT passed to MintConnectHeaders.
  repeated string jwt_audiences = 1;
}

message MintConnectHeadersRequest {
  string actor_atespace = 1;
  string actor_name = 2;
  string actor_uid = 3;
  string actor_jwt = 4 [ debug_redact = true ];
  repeated bytes actor_certificates = 5;
}

message MintConnectHeadersResponse {
  map<string, string> connect_headers = 1 [ debug_redact = true ];
  int64 expires_at_unix_sec = 2;
}
